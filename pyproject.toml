[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onionlens"
version = "0.1.0"
description = "Dark web threat-intelligence collection, analysis and visualization platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx[socks]>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "networkx>=3.3",
    "langdetect>=1.0.9",
    "typer>=0.12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
queue = ["celery>=5.4", "redis>=5.0"]
search = ["opensearch-py>=2.7"]
nlp = ["spacy>=3.7"]
ml = ["transformers>=4.44", "torch>=2.3"]
telegram = ["telethon>=1.36"]
translate = ["argostranslate>=1.9"]
dev = ["pytest>=8.3", "ruff>=0.6"]
all = ["onionlens[postgres,queue,search,telegram,dev]"]

[project.scripts]
onionlens = "onionlens.cli:app"

[tool.setuptools.packages.find]
include = ["onionlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
