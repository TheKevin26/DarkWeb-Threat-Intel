# Collection sources. ONLY add sites you are legally permitted to collect from, and review each one
# manually before adding it. The Tor crawler never leaves the hosts listed here.

# Ransomware leak sites are handled automatically by the `leaksites` collector (addresses come from
# ransomware.live's public directory) - you do not need to list them here.

onion_seeds: []
#  - name: example-forum
#    url: http://<56-char-v3-address>.onion/forums/selling.12/
#    type: forum          # site | forum | market. forum = one document per post (author, date, text);
#                         # market = one document per listing (title, price, vendor)
#    max_pages: 30        # optional, overrides ONIONLENS_CRAWL_MAX_PAGES
#    max_depth: 2         # optional
#    extra_hosts: []      # mirrors of the same site that may also be followed
#    cookie_env: EXAMPLE_FORUM_COOKIE
#                         # optional: name of an environment variable holding a session cookie string
#                         # ("name=value; name2=value2") for an account YOU registered and are authorised
#                         # to use. OnionLens never logs in, never stores passwords, never posts.
#    headers: {}          # optional extra request headers
#
# Supported forum engines: XenForo, phpBB, MyBB, SMF, vBulletin (+ generic fallback).

# Public Telegram channels (usernames, no @). Requires ONIONLENS_TELEGRAM_API_ID / _API_HASH.
telegram_channels: []

# Clearnet pages (public pastes, researcher feeds). Text/HTML only.
clearnet_urls: []
#  - name: some-public-feed
#    url: https://example.org/feed.txt

# Terms searched on the Ahmia onion search engine (metadata only - onion sites are not visited).
ahmia_queries:
  - acme-industries
  - database leak
